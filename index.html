<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Biodata Card Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap">
<style>
/* Layout: sticky toolbar; editor form beside a live card preview (stacked into Edit/Preview tabs on phones). */
:root {
  --bg: #f2f3f7; --panel: #ffffff; --fg: #18213a; --muted: #5d6680; --line: #dcdfe8;
  --accent: #1e3a6e; --accent-fg: #ffffff; --soft: #e8ecf5; --danger: #b3261e;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141c; --panel: #1a1f2b; --fg: #e9ebf2; --muted: #a0a7ba; --line: #2d3445;
  --accent: #d6ad52; --accent-fg: #1a1406; --soft: #242b3a; --danger: #f2a49e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11141c; --panel: #1a1f2b; --fg: #e9ebf2; --muted: #a0a7ba; --line: #2d3445;
  --accent: #d6ad52; --accent-fg: #1a1406; --soft: #242b3a; --danger: #f2a49e; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.brand { font-weight: 600; letter-spacing: 0.01em; margin-right: auto; display: flex; flex-direction: column; line-height: 1.2; }
.brand small { font-weight: 400; color: var(--muted); font-size: 12px; }
.picker { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 220px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 12px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--panel); border-color: var(--danger); }
.status { font-size: 12px; color: var(--muted); width: 100%; }

.tabs { display: none; width: 100%; gap: 4px; background: var(--soft); border-radius: 10px; padding: 3px; }
.tabs button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 7px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.main { display: grid; grid-template-columns: minmax(320px, 430px) minmax(0, 1fr); gap: 20px; align-items: start;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.editor { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.preview { position: sticky; top: 90px; min-width: 0; }

.note { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
summary { padding: 12px 14px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
summary::after { content: "+"; color: var(--muted); font-weight: 400; }
details[open] summary::after { content: "–"; }
.fields { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
label.f select { max-width: none; width: 100%; background: var(--bg); font-size: 15px; color: var(--fg); }
input[type="text"], textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 15px; color: var(--fg); }
textarea { resize: vertical; min-height: 62px; line-height: 1.4; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) auto; gap: 6px; align-items: center; }
.row.hl { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto; }
.check { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 6px; border-radius: 6px; }
.x:hover { background: var(--soft); color: var(--danger); }
.add { align-self: flex-start; border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 7px 12px; color: var(--accent); font-weight: 500; }
.block { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.block-head { display: flex; gap: 6px; align-items: center; }
.block-head input { flex: 1; }

.stage-wrap { position: relative; overflow: hidden; border-radius: 6px; box-shadow: 0 6px 24px rgba(10, 20, 50, .18); }
.stage { width: 900px; transform-origin: top left; }
.hint { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }

.modal { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 24, .7); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal[hidden] { display: none; }
.modal-card { background: var(--panel); border-radius: 14px; padding: 14px; max-width: 520px; width: 100%; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.modal-card img { width: 100%; border-radius: 6px; }

@media (max-width: 860px) {
  .tabs { display: flex; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .preview { position: static; }
  body[data-tab="edit"] .preview, body[data-tab="preview"] .editor { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- The biodata card (a fixed print design, same in both themes) ---------- */
.bd { --navy: #0f1f45; --navy2: #1d3468; --gold: #c39a3e; --gold-l: #e6c97c; --gold-d: #8e6a22; --cream: #fcf5e1; --ink: #0f1f45;
  position: relative; width: 900px; min-height: 1350px; overflow: hidden; color: var(--ink);
  padding: 82px 34px 66px;
  background: radial-gradient(ellipse 120% 70% at 50% 0%, var(--navy2) 0%, var(--navy) 62%);
  font-family: "Crimson Pro", "Times New Roman", Georgia, serif; }
/* Concept: a gold-framed Islamic arch window of parchment set into a jewel-toned, star-latticed wall. */
.bd-lattice { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.bd-outer { position: absolute; inset: 12px; border: 1.5px solid var(--gold); border-radius: 12px; pointer-events: none; }
.bd-outer::after { content: ""; position: absolute; inset: 5px; border: 1px solid var(--gold); border-radius: 8px; opacity: .45; }
.bd-finial { position: absolute; top: 8px; left: 50%; width: 92px; transform: translateX(-50%); pointer-events: none; }
.bd-foot { position: absolute; bottom: 24px; left: 50%; width: 240px; transform: translateX(-50%); pointer-events: none; }
.bd-panel { position: relative; }
.bd-cap { display: block; width: 832px; height: 300px; }
.bd-finial { height: 84px; } .bd-foot { height: 20px; } .bd-mandala { height: 680px; }
.bd-deco svg { display: block; width: 116px; height: 116px; }
.bd-body { position: relative; display: flow-root; margin-top: -1px; background: #fbf3dd; border: 3px solid var(--gold); border-top: 0; border-radius: 0 0 22px 22px; padding: 0 46px 112px; }
.bd-line { position: absolute; left: 8px; right: 8px; top: 0; bottom: 8px; border: 1px solid var(--gold); border-top: 0; border-radius: 0 0 14px 14px; pointer-events: none; }
.bd-mandala { position: absolute; left: 50%; top: 360px; width: 680px; transform: translateX(-50%); pointer-events: none; }
.bd-deco { position: absolute; pointer-events: none; }
.bd-deco.lt { bottom: 18px; left: 16px; width: 116px; }
.bd-deco.lb { bottom: 18px; right: 16px; width: 116px; }
.bd-in { position: relative; margin-top: -182px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.bd-name { margin: 0; font-size: 70px; font-weight: 700; line-height: 1.05; letter-spacing: .005em; color: var(--ink); }
.bd-orn { width: 170px; height: 18px; margin: 8px 0 6px; }
.bd-title { padding: 6px 46px 8px; border: 2px solid var(--gold); border-radius: 999px; font-style: italic; font-weight: 700; font-size: 38px; color: var(--ink);
  background: linear-gradient(180deg, #fff7df 0%, #f2dc9f 100%); box-shadow: 0 2px 0 var(--gold-d); }
.bd-inst { margin-top: 10px; font-weight: 700; font-size: 28px; }
.bd-tag { margin: 8px 0 0; font-style: italic; font-weight: 600; font-size: 28px; line-height: 1.2; max-width: 680px; white-space: pre-line; }
.bd-box { position: relative; width: 100%; margin-top: 46px; border: 2px solid var(--gold); border-radius: 24px; padding: 40px 26px 20px; background: rgba(255, 251, 240, .9); }
.bd-badge { display: inline-block; padding: 4px 40px 7px; border-radius: 999px; border: 3px solid var(--gold);
  background: linear-gradient(180deg, var(--navy2), var(--navy)); color: #fff6dc; font-style: italic; font-weight: 700; font-size: 33px; line-height: 1.15; white-space: nowrap; }
.bd-box > .bd-badge { position: absolute; top: -27px; left: 50%; transform: translateX(-50%); }
.bd-pgrid { display: grid; grid-template-columns: 1fr 2px 1fr; gap: 22px; text-align: left; font-size: 25px; }
.bd-vline { background: linear-gradient(180deg, transparent, var(--gold), transparent); }
.bd-kv { display: grid; grid-template-columns: max-content 22px 1fr; row-gap: 4px; align-content: start; }
.bd-kv .k { font-weight: 600; } .bd-kv .c { text-align: center; } .bd-kv .v { font-weight: 600; white-space: pre-line; }
.bd-edu { width: 640px; max-width: 100%; margin: 0 auto; display: flex; flex-direction: column; font-size: 24px; font-weight: 600; text-align: left; }
.bd-edu .r { display: grid; grid-template-columns: 1.15fr 30px 1fr; padding: 3px 14px; border-bottom: 1px solid rgba(195, 154, 62, .45); }
.bd-edu .r:last-child { border-bottom: 0; }
.bd-edu .r.hl { background: linear-gradient(90deg, rgba(230, 201, 124, .25), rgba(230, 201, 124, .55), rgba(230, 201, 124, .25)); border-radius: 8px; border-bottom-color: transparent; margin-top: 3px; }
.bd-edu .c { text-align: center; }
.bd-sec { width: 100%; margin-top: 24px; }
.bd-rule { display: flex; align-items: center; gap: 14px; }
.bd-rule::before, .bd-rule::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, transparent, var(--gold)); }
.bd-rule::after { background: linear-gradient(90deg, var(--gold), transparent); }
.bd-sec p { margin: 8px auto 0; max-width: 720px; font-size: 26px; line-height: 1.22; font-weight: 600; white-space: pre-line; }
.bd-sec p.big { font-size: 30px; font-weight: 700; }
.bd-minis { width: 100%; margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.bd-mini { position: relative; border: 2px solid var(--gold); border-radius: 20px; padding: 36px 14px 14px; background: rgba(255, 251, 240, .94); }
.bd-mini > .bd-badge { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-size: 30px; padding-inline: 30px; }
.bd-mini p { margin: 0; font-size: 27px; font-weight: 700; white-space: pre-line; display: flex; align-items: center; justify-content: center; gap: 10px; }
.bd-mini svg { width: 26px; height: 26px; flex: none; }
.bd-closing { margin: 30px 0 0; font-style: italic; font-weight: 600; font-size: 29px; line-height: 1.2; max-width: 600px; white-space: pre-line; }
.bd-box, .bd-mini { background: rgba(255, 250, 236, .92); }
.bd .empty, .md .empty { opacity: .35; }

/* ---------- Modern design: white sheet, ink side bar, leaf sketch, icon-led sections ---------- */
.md { --ink: #14284a; position: relative; width: 900px; min-height: 1273px; overflow: hidden; display: flex; flex-direction: column;
  padding: 60px 56px 40px 92px; background: #fdfdfc; color: #1d2433; font-family: "Source Serif 4", "Crimson Pro", Georgia, serif; }
.md-bar { position: absolute; left: 0; top: 0; width: 44px; height: 740px; background: var(--ink); border-bottom-right-radius: 44px 190px; }
.md-leaf { position: absolute; top: 26px; right: 22px; width: 260px; height: 210px; }
.md-name { margin: 50px 0 0; max-width: 620px; font-size: 84px; line-height: 1.05; font-weight: 500; color: var(--ink); }
.md-uline { width: 104px; height: 4px; margin-top: 16px; border-radius: 2px; background: var(--ink); }
.md-head { display: flex; align-items: center; margin: 34px 0 14px; }
.md-ico { position: relative; z-index: 1; flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--ink); display: flex; align-items: center; justify-content: center; }
.md-ico svg { width: 28px; height: 28px; }
.md-pill { flex: 1; min-width: 0; margin-left: -20px; padding: 10px 18px 10px 46px; border-radius: 10px; background: #efedea;
  font-size: 23px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; }
.md-kv { display: grid; grid-template-columns: 270px 36px minmax(0, 1fr); row-gap: 5px; padding-left: 24px; font-size: 24px; }
.md-kv .c { text-align: center; } .md-kv .v { white-space: pre-line; } .md-kv .v.hl { font-weight: 700; }
.md-rule { height: 1px; margin-top: 26px; background: #d5d3cf; }
.md-cols { display: grid; grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr); column-gap: 30px; }
.md-vrule { background: #c9cbd4; margin-top: 30px; }
.md-col { min-width: 0; }
.md-col .md-head { margin-top: 30px; }
.md-col .md-kv { grid-template-columns: max-content 28px minmax(0, 1fr); padding-left: 16px; font-size: 22px; }
.md-col p { margin: 0; padding-left: 16px; font-size: 23px; line-height: 1.38; white-space: pre-line; }
.md-col p strong { font-weight: 700; }
.md-spacer { flex: 1; min-height: 34px; }
.md-contact { margin: 0 -24px 0 -48px; padding: 20px 30px; border-radius: 18px; background: var(--ink); color: #fff;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px 22px; font-size: 24px; }
.md-contact > span { display: flex; align-items: center; gap: 12px; }
.md-contact svg { width: 30px; height: 30px; flex: none; }
.md-contact .sep { width: 1px; height: 36px; background: rgba(255, 255, 255, .5); }
</style>

<header class="bar">
  <div class="brand">Biodata Card Maker<small>Edit, then save the card as an image</small></div>
  <div class="picker">
    <select id="profileSelect" aria-label="Saved biodatas"></select>
    <button class="btn" id="newBtn" type="button">New</button>
    <button class="btn" id="dupBtn" type="button">Duplicate</button>
    <button class="btn danger" id="delBtn" type="button">Delete</button>
    <button class="btn primary" id="saveImgBtn" type="button">Save image</button>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabEdit" aria-selected="true">Edit</button>
    <button type="button" role="tab" id="tabPreview" aria-selected="false">Preview</button>
  </div>
  <div class="status" id="status">Loading your saved biodatas…</div>
</header>

<main class="main">
  <section class="editor" id="editor" aria-label="Edit details"></section>
  <section class="preview" aria-label="Card preview">
    <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage"></div></div>
    <p class="hint">Live preview. "Save image" makes a high-resolution PNG you can share on WhatsApp.</p>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <strong id="modalTitle">Your card</strong>
    <p class="note" id="modalNote">Press and hold the image, then choose Save or Share.</p>
    <img id="modalImg" alt="Biodata card image">
    <button class="btn primary" id="modalDownload" type="button" hidden>Download image</button>
    <button class="btn" id="modalShare" type="button" hidden>Share (WhatsApp, etc.)</button>
    <button class="btn" id="modalClose" type="button">Close</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(() => {
  // ---------- data ----------
  const SAMPLE = {
    design: "modern",
    style: "navy",
    name: "Ahmed Rashid",
    title: "Assistant Professor of English",
    institution: "Government Arts College, Kozhikode",
    tagline: "A simple, sincere and family-oriented person,\nwith a love for teaching and reading.",
    personalHeading: "Personal Details",
    personal: [
      { k: "Date of Birth", v: "12 March 1995" }, { k: "Age", v: "31 Years" }, { k: "Height", v: "172 cm (5 ft 8 in)" },
      { k: "Religion", v: "Islam" }, { k: "Sect", v: "Sunni" }, { k: "Nationality", v: "Indian" },
      { k: "Place of Birth", v: "Kozhikode, Kerala" }, { k: "Residence", v: "Feroke, Kozhikode" }
    ],
    eduHeading: "Education & Qualifications",
    education: [
      { k: "Graduation", v: "BA", hl: false }, { k: "Post Graduation", v: "MA English", hl: false },
      { k: "Teacher Training", v: "B.Ed", hl: false }, { k: "UGC-NET", v: "Qualified", hl: true }
    ],
    family: [ { k: "Father", v: "Abdul Rahman" }, { k: "Mother", v: "Fathima" }, { k: "Siblings", v: "2 Brothers, 1 Sister" } ],
    aboutFamily: "A close-knit, religious and value-oriented family based in Kozhikode, Kerala.",
    phone: "+91 98765 43210",
    email: "ahmed.rashid@example.com",
    sections: [
      { h: "My Profession", t: "Assistant Professor of English", big: true },
      { h: "My Nature", t: "By nature, I am a calm and down-to-earth person.\nI love reading, travelling and guiding students.", big: false },
      { h: "My Family", t: "I come from a respectable and supportive family\nfrom Kozhikode, who have always encouraged me.", big: false }
    ],
    boxes: [
      { h: "Siblings", t: "2 Brothers & 1 Sister", phone: false },
      { h: "Contact Details", t: "+91 98765 43210", phone: true }
    ],
    closing: "I would be happy to have a life partner\nwho shares these values and walks together in life."
  };
  const blank = () => {
    const s = clone(SAMPLE);
    s.name = s.title = s.institution = s.tagline = s.closing = s.aboutFamily = s.phone = s.email = "";
    s.personal.forEach(r => r.v = "");
    s.family.forEach(r => r.v = "");
    s.education.forEach(r => { r.v = ""; });
    s.sections.forEach(r => r.t = "");
    s.boxes.forEach(r => r.t = "");
    return s;
  };
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  const newId = () => "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- state ----------
  let cur = { id: newId(), state: clone(SAMPLE), saved: false, isSample: true };
  let profiles = []; // {id, state, updatedAt}
  let store = null;  // {mode, list, save, remove}
  let firstListHandled = false;

  const $ = id => document.getElementById(id);
  const statusEl = $("status");
  const setStatus = t => { statusEl.textContent = t; };

  // ---------- storage ----------
  const LS_KEY = "biodata.v1", LAST_KEY = "biodata.last";
  function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

  function localStore() {
    const read = () => { try { return JSON.parse(lsGet(LS_KEY) || "{}"); } catch { return {}; } };
    return {
      mode: "local",
      subscribe(cb) { const all = read(); cb(Object.entries(all).map(([id, d]) => ({ id, ...d }))); },
      async save(id, state) { const all = read(); all[id] = { state, updatedAt: Date.now() }; lsSet(LS_KEY, JSON.stringify(all)); },
      async remove(id) { const all = read(); delete all[id]; lsSet(LS_KEY, JSON.stringify(all)); }
    };
  }
  async function cloudStore() {
    if (!window.claude || !window.claude.use) return null;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return null;
      const uid = await user.id();
      if (!uid) return null;
      const col = db.collection("data/users/" + uid);
      return {
        mode: "cloud",
        subscribe(cb, onErr) { return col.onSnapshot(snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() })), snap.metadata), onErr); },
        save(id, state) { return col.doc(id).set({ state, updatedAt: Date.now() }); },
        remove(id) { return col.doc(id).delete(); }
      };
    } catch { return null; }
  }

  // ---------- autosave (one write at a time) ----------
  let saveTimer = null, inflight = false, again = false;
  function scheduleSave() {
    cur.isSample = false;
    clearTimeout(saveTimer);
    setStatus("Saving…");

    s = Object.assign({}, s, { personal: s.personal.concat((s.family || []).filter(r => has(r.v))) });
    const half = Math.ceil(s.personal.length / 2);
    const kv = rows => rows.map(r => `<div class="k">${esc(r.k)}</div><div class="c">:</div><div class="v">${val(r.v, "—")}</div>`).join("");
    const edu = s.education.map(r => `<div class="r${r.hl ? " hl" : ""}"><div>${esc(r.k)}</div><div class="c">:</div><div>${val(r.v, "—")}</div></div>`).join("");
    const secs = s.sections.filter(r => (r.h || "").trim() || (r.t || "").trim()).map(r =>
      `<div class="bd-sec"><div class="bd-rule"><span class="bd-badge">${esc(r.h)}</span></div><p class="${r.big ? "big" : ""}">${val(r.t, "…")}</p></div>`).join("");
    const minis = s.boxes.slice(0, 2).filter(b => (b.h || "").trim() || (b.t || "").trim()).map(b =>
      `<div class="bd-mini"><span class="bd-badge">${esc(b.h)}</span><p>${b.phone ? phoneIcon.replace("#0f1f45", themeOf(s).ink) : ""}<span>${val(b.t, "—")}</span></p></div>`).join("");
    const t = themeOf(s);
    return `<div class="bd" style="--navy:${t.dark};--navy2:${t.light};--ink:${t.ink}">
      ${lattice}<div class="bd-outer"></div>${finial}${foot}
      <div class="bd-panel">${archCap}<div class="bd-body"><div class="bd-line"></div>${mandala}
      <div class="bd-deco lt">${laurel(false)}</div><div class="bd-deco lb">${laurel(true)}</div>
      <div class="bd-in">
        <h1 class="bd-name">${val(s.name, "Full Name")}</h1>
        ${orn}
        ${(s.title || "").trim() ? `<div class="bd-title">${esc(s.title)}</div>` : ""}
        ${(s.institution || "").trim() ? `<div class="bd-inst">${esc(s.institution)}</div>` : ""}
        ${(s.tagline || "").trim() ? `<p class="bd-tag">${esc(s.tagline)}</p>` : ""}
        ${s.personal.length ? `<section class="bd-box"><span class="bd-badge">${esc(s.personalHeading)}</span>
          <div class="bd-pgrid"><div class="bd-kv">${kv(s.personal.slice(0, half))}</div><div class="bd-vline"></div><div class="bd-kv">${kv(s.personal.slice(half))}</div></div></section>` : ""}
        ${s.education.length ? `<section class="bd-box"><span class="bd-badge">${esc(s.eduHeading)}</span><div class="bd-edu">${edu}</div></section>` : ""}
        ${secs}
        ${minis ? `<div class="bd-minis">${minis}</div>` : ""}
        ${(s.closing || "").trim() ? `<p class="bd-closing">${esc(s.closing)}</p>` : ""}
        ${orn}
      </div></div></div></div>`;
  }
  const stage = $("stage"), stageWrap = $("stageWrap");
  function renderCard() { stage.innerHTML = cardHTML(cur.state); fit(); }
  function fit() {
    const w = stageWrap.parentElement.clientWidth; if (!w) return;
    const sc = Math.min(1, w / 900);
    stage.style.transform = `scale(${sc})`;
    stageWrap.style.width = 900 * sc + "px";
    stageWrap.style.height = stage.offsetHeight * sc + "px";
  }
  new ResizeObserver(fit).observe(stageWrap.parentElement);
  if (document.fonts) document.fonts.ready.then(fit);

  // ---------- toolbar ----------
  $("profileSelect").addEventListener("change", e => {
    const p = profiles.find(x => x.id === e.target.value); if (p) openProfile(p);
  });
  $("newBtn").addEventListener("click", () => {
    cur = { id: newId(), state: blank(), saved: false, isSample: false };
    renderEditor(); renderCard(); renderSelect(); showTab("edit");
    setStatus("New blank biodata. It saves once you type something.");
    const n = $("f-name"); if (n) n.focus();
  });
  $("dupBtn").addEventListener("click", () => {
    const s = clone(cur.state);
    cur = { id: newId(), state: s, saved: false, isSample: false };
    renderEditor(); renderCard(); scheduleSave(); renderSelect();
    setStatus("Copied. Edit the details for the new person.");
  });
  let armTimer = null;
  $("delBtn").addEventListener("click", async () => {
    const b = $("delBtn");
    if (!b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "Tap again to delete";
      clearTimeout(armTimer); armTimer = setTimeout(() => { b.classList.remove("armed"); b.textContent = "Delete"; }, 3500);
      return;
    }
    clearTimeout(armTimer); b.classList.remove("armed"); b.textContent = "Delete";
    clearTimeout(saveTimer);
    const id = cur.id;
    try { if (store && cur.saved) await store.remove(id); } catch { setStatus("Couldn't delete. Try again."); return; }
    profiles = profiles.filter(p => p.id !== id);
    if (profiles.length) openProfile(profiles[0]);
    else { cur = { id: newId(), state: blank(), saved: false, isSample: false }; renderEditor(); renderCard(); renderSelect(); }
    setStatus("Deleted.");
  });

  // ---------- tabs (phone) ----------
  function showTab(t) {
    document.body.dataset.tab = t;
    $("tabEdit").setAttribute("aria-selected", t === "edit"); $("tabPreview").setAttribute("aria-selected", t === "preview");
    if (t === "preview") requestAnimationFrame(fit);
  }
  $("tabEdit").addEventListener("click", () => showTab("edit"));
  $("tabPreview").addEventListener("click", () => showTab("preview"));
  showTab("edit");

  // ---------- export ----------
  let downloads = null;
  const fileName = () => (labelOf(cur.state).replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-") || "biodata") + "-biodata.png";
  $("saveImgBtn").addEventListener("click", async () => {
    const btn = $("saveImgBtn");
    if (typeof html2canvas !== "function") { setStatus("The image tool didn't load. Reload the page and try again."); return; }
    btn.disabled = true; const old = btn.textContent; btn.textContent = "Making image…";
    const host = document.createElement("div");
    host.style.cssText = "position:fixed;left:-12000px;top:0;width:900px;pointer-events:none;";
    host.innerHTML = cardHTML(cur.state);
    document.body.appendChild(host);
    try {
      if (document.fonts) await document.fonts.ready;
      const canvas = await html2canvas(host.firstElementChild, { scale: 2, backgroundColor: "#ffffff", logging: false, useCORS: true });
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      let saved = false;
      if (downloads && blob) {
        try { await downloads.save({ filename: fileName(), data: blob }); saved = true; setStatus("Image saved."); }
        catch (e) { if (e && e.code === "declined") { setStatus("Save cancelled."); saved = true; } }
      }
      if (!saved) {
        lastBlob = blob;
        const inClaude = !!(window.claude && window.claude.use);
        const file = blob && new File([blob], fileName(), { type: "image/png" });
        const canShare = !inClaude && file && navigator.canShare && navigator.canShare({ files: [file] });
        $("modalDownload").hidden = inClaude;
        $("modalShare").hidden = !canShare;
        $("modalNote").textContent = inClaude ? "Press and hold the image, then choose Save or Share." : "Download the image, or share it straight to WhatsApp.";
        $("modalImg").src = canvas.toDataURL("image/png");
        $("modal").hidden = false;
      }
    } catch (e) {
      setStatus("Couldn't make the image. Try again.");
    } finally {
      host.remove(); btn.disabled = false; btn.textContent = old;
    }
  });
  let lastBlob = null;
  $("modalDownload").addEventListener("click", () => {
    if (!lastBlob) return;
    const url = URL.createObjectURL(lastBlob), a = document.createElement("a");
    a.href = url; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    setStatus("Image downloaded. Check your Downloads or Files.");
  });
  $("modalShare").addEventListener("click", async () => {
    if (!lastBlob) return;
    try { await navigator.share({ files: [new File([lastBlob], fileName(), { type: "image/png" })], title: labelOf(cur.state) + " biodata" }); }
    catch (e) { if (!e || e.name !== "AbortError") setStatus("Sharing isn't available here. Use Download instead."); }
  });
  $("modalClose").addEventListener("click", () => { $("modal").hidden = true; $("modalImg").removeAttribute("src"); });

  // ---------- start ----------
  renderEditor(); renderCard(); renderSelect();
  (async () => {
    if (window.claude && window.claude.use) { try { downloads = await window.claude.use("downloads"); } catch { downloads = null; } }
  })();
  (async () => {
    store = (await cloudStore()) || localStore();
    let gotFresh = false;
    const timer = setTimeout(() => { if (!gotFresh) setStatus("Can't reach your saved biodatas yet. You can keep editing."); }, 10000);
    const mine = store;
    mine.subscribe((list, meta) => {
      if (store !== mine) return;
      if (!meta || !meta.fromCache) { gotFresh = true; clearTimeout(timer); }
      applyList(list);
    }, () => { clearTimeout(timer); if (store === mine) { store = localStore(); store.subscribe(applyList); } });
    if (store.mode === "local") clearTimeout(timer);
  })();
})();
</script>

</body>
</html>
